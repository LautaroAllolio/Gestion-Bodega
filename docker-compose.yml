services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bodega}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cambiar_en_produccion}"
    ports:
      - "55433:5432"
    volumes:
      - bodega_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bodega}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-cambiar_en_produccion}@db:5432/${POSTGRES_DB:-bodega}"
      BODEGA_PROPIETARIO_PASSWORD: "${BODEGA_PROPIETARIO_PASSWORD:-propietario_cambiar}"
      BODEGA_API_PASSWORD: "${BODEGA_API_PASSWORD:-api_cambiar}"
      BODEGA_LECTURA_PASSWORD: "${BODEGA_LECTURA_PASSWORD:-lectura_cambiar}"
      SEED_SCALE: "${SEED_SCALE:-1.0}"
      FORCE_RELOAD: "${FORCE_RELOAD:-0}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: "postgresql://bodega_api:${BODEGA_API_PASSWORD:-api_cambiar}@db:5432/${POSTGRES_DB:-bodega}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      POOL_MIN_SIZE: "${POOL_MIN_SIZE:-1}"
      POOL_MAX_SIZE: "${POOL_MAX_SIZE:-10}"
    ports:
      - "8001:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  bodega_pgdata:
